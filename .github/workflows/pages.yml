name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare deployment artifact
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm _site/.gitignore
      - name: Configure privacy-first analytics
        env:
          PORTFOLIO_POSTHOG_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          PORTFOLIO_POSTHOG_HOST: ${{ vars.POSTHOG_API_HOST }}
        run: |
          test -n "$PORTFOLIO_POSTHOG_TOKEN"
          test -n "$PORTFOLIO_POSTHOG_HOST"
          printf 'window.__PORTFOLIO_ANALYTICS__ = {"token":"%s","host":"%s"};\n' "$PORTFOLIO_POSTHOG_TOKEN" "$PORTFOLIO_POSTHOG_HOST" > _site/js/analytics-config.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
